<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — The Weekly Plate</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #171717;
          color: #fafafa;
        }
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 20px 0 8px;
      }
      p {
        margin: 0;
        opacity: 0.7;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        The Weekly Plate needs a connection to load your meals. Reconnect and
        try again.
      </p>
    </main>
  </body>
</html>
